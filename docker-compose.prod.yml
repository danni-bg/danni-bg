# Single-host production overlay (self-hosting). Use TOGETHER with the base file — the base provides the
# Ory services, this turns them production-grade and adds the built app container. (For the scalable
# multi-node k8s/Terraform deployment, see the private danni-bg/deploy repo.)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Secrets come from the environment (FR-136), NEVER the committed placeholders. Required env:
#   POSTGRES_PASSWORD, KRATOS_SECRETS_COOKIE (32+ chars), KRATOS_SECRETS_CIPHER (exactly 32 chars),
#   COURIER_SMTP_CONNECTION_URI (a REAL SMTP relay, e.g. smtps://user:pass@smtp.relay.tld:465 —
#   recovery/verification mail is account-takeover material, so the dev Mailpit sink is refused;
#   spec 037 FR-190..192), DANNI_PROFILE=production. The read substrate (datasets/FTS5/vectors) must
#   be seeded into the danni_store volume via the sync pipeline (danni sync → curate → index) or a
#   restored backup.
#
# Hosted on a real domain? Set DANNI_PUBLIC_URL + DANNI_COOKIE_DOMAIN + DANNI_PASSKEY_RP_ID (all
# three together — see infra/ory/README.md "Deploying on a real domain"). Unset, everything below
# falls back to the localhost single-port defaults, so the localhost self-host journey is unchanged.
services:
  kratos-postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}

  kratos-migrate:
    environment:
      DSN: postgres://kratos:${POSTGRES_PASSWORD:?}@kratos-postgres:5432/kratos?sslmode=disable

  kratos:
    # No --dev in production; env-injected secrets override the YAML placeholders (Ory env mapping).
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    environment:
      DSN: postgres://kratos:${POSTGRES_PASSWORD:?}@kratos-postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:?set KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:?set KRATOS_SECRETS_CIPHER}
      # Real relay ONLY (spec 037): recovery/verification links are account-takeover material. The
      # secret gate (check-secrets) additionally rejects Mailpit/localhost-shaped values (FR-191).
      COURIER_SMTP_CONNECTION_URI: ${COURIER_SMTP_CONNECTION_URI:?set COURIER_SMTP_CONNECTION_URI to a real SMTP relay}
      # Domain parameterization (audit remedy; infra/ory/README.md "Deploying on a real domain").
      # kratos.yaml hardcodes localhost in every browser-facing URL; the Ory env mapping overrides
      # each key here. ONE operator var (DANNI_PUBLIC_URL — scheme+host, NO trailing slash) drives
      # the URLs; compose can't parse URLs, so the cookie domain + passkey RP id are separate
      # host-only vars. The secret gate sanity-checks DANNI_PUBLIC_URL (https, no trailing slash).
      # NOTE array semantics (verified against v26.2.0): env lists merge over the YAML PER-INDEX,
      # so each list supplies exactly as many items as the YAML has — that stomps the Vite-dev
      # :5173 entries out of prod CORS/return-URLs/passkey origins. The trailing-slash CORS item
      # only satisfies the schema's uniqueItems; no real Origin header ever matches it.
      SERVE_PUBLIC_BASE_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/kratos/
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: "${DANNI_PUBLIC_URL:-http://localhost:8790},${DANNI_PUBLIC_URL:-http://localhost:8790}/"
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/
      SELFSERVICE_ALLOWED_RETURN_URLS: "${DANNI_PUBLIC_URL:-http://localhost:8790},${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/callback,${DANNI_PUBLIC_URL:-http://localhost:8790}/admin/settings,${DANNI_PUBLIC_URL:-http://localhost:8790},${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/callback,${DANNI_PUBLIC_URL:-http://localhost:8790}/admin/settings"
      # RP id = the registrable domain (no scheme/port). CHANGING it invalidates registered passkeys.
      SELFSERVICE_METHODS_PASSKEY_CONFIG_RP_ID: ${DANNI_PASSKEY_RP_ID:-localhost}
      SELFSERVICE_METHODS_PASSKEY_CONFIG_RP_ORIGINS: "${DANNI_PUBLIC_URL:-http://localhost:8790},${DANNI_PUBLIC_URL:-http://localhost:8790}"
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/error
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/settings
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/recovery
      SELFSERVICE_FLOWS_RECOVERY_AFTER_DEFAULT_BROWSER_RETURN_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/login
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/verification
      SELFSERVICE_FLOWS_VERIFICATION_AFTER_DEFAULT_BROWSER_RETURN_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/login
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/login
      SELFSERVICE_FLOWS_LOGIN_AFTER_DEFAULT_BROWSER_RETURN_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/callback
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/register
      SELFSERVICE_FLOWS_REGISTRATION_AFTER_DEFAULT_BROWSER_RETURN_URL: ${DANNI_PUBLIC_URL:-http://localhost:8790}/auth/callback
      SESSION_COOKIE_DOMAIN: ${DANNI_COOKIE_DOMAIN:-localhost}

  # Mailpit is a dev-only mail sink — its unauthenticated UI would leak every recovery link. The
  # never-activated profile keeps it out of the production stack entirely (not started, no host
  # port); Kratos does not depend on it (spec 037, FR-192).
  mailpit:
    profiles:
      - dev-only

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: danni-app:latest
    container_name: danni-app
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      DANNI_PROFILE: ${DANNI_PROFILE:-production}
      DANNI_STORE_ROOT: /data
      # The app entrypoint runs the secret gate on its OWN env; deployment-wide required secrets (the
      # Kratos cookie/cipher) are gated in CI, so the app needs none of its own here.
      DANNI_REQUIRED_SECRETS: ""
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:-http://kratos:4433}
      EXPLORER_DEFAULT_PROVIDER: ${EXPLORER_DEFAULT_PROVIDER:-}
      EXPLORER_DEFAULT_MODEL: ${EXPLORER_DEFAULT_MODEL:-}
      EXPLORER_DEFAULT_BASE_URL: ${EXPLORER_DEFAULT_BASE_URL:-}
      EXPLORER_DEFAULT_API_KEY: ${EXPLORER_DEFAULT_API_KEY:-}
    # The app image runs NON-ROOT as uid:gid 10001:10001 (spec 044 FR-262). A FRESH named volume is
    # created world-writable-by-owner and chowned on boot, so it just works. Upgrading a PRE-EXISTING
    # root-era volume once: `docker run --rm -v danni_store:/data alpine chown -R 10001:10001 /data`
    # (SC-4) — otherwise migrate-on-boot cannot write the SQLite store.
    volumes:
      - danni_store:/data
    depends_on:
      kratos:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:8790/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  danni_store:
