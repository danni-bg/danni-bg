[test]
preload = ["./tests/setup.ts"]
# Keep the test-file crawler out of non-source trees. "store/**" is load-bearing: a populated
# mirror holds hundreds of thousands of directories and the crawl dies with EMFILE before any
# test runs (requires bun >= 1.3.14 — older buns silently ignore this key and re-break).
pathIgnorePatterns = ["store/**", "coverage/**", "vendor/**", "eval/**", "infra/**"]
coverage = true
# 100% coverage (Constitution VIII) — enforced in CI via `bun run coverage`.
# Bun reports line + function coverage; both are pinned to 100%.
coverageThreshold = { lines = 1.0, functions = 1.0 }
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true
