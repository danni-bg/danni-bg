name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Migrate (smoke)
        run: bun run db:migrate

      - name: Test with coverage
        run: bun run coverage

      - name: Assert parity matrix coverage
        run: |
          bun run --bun tests/parity-matrix-check.ts

  # Build + push the app image to GHCR (spec 030, FR-137), after the hermetic test gate. Uses the
  # built-in GITHUB_TOKEN (packages: write) — no PAT. Tags:
  #   push to main      → :edge, :acceptance, :sha-<short>   (the acceptance overlay tracks :acceptance)
  #   tag vX.Y.Z        → :X.Y.Z, :X.Y, :stable, :latest      (the prod overlay pins :stable → a digest)
  image:
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Container metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/danni-app
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=acceptance,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load LOCALLY, and guard the image before publishing (spec 044 FR-264): a slim,
      # non-root image is a release invariant, not a hope. The push step below reuses the gha cache.
      - name: Build (load for the hardening guard)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: danni-app:guard
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'Guard: minimal + non-root image (spec 044 FR-264)'
        run: |
          set -euo pipefail
          IMG=danni-app:guard
          # (b) effective UID must be non-zero (WORKDIR /app; --entrypoint overrides the boot script).
          uid=$(docker run --rm --entrypoint sh "$IMG" -c 'id -u')
          echo "image effective uid=$uid"
          test "$uid" -ne 0
          # (a) no dev/SPA-build toolchain under node_modules.
          docker run --rm --entrypoint sh "$IMG" -c '! test -e node_modules/@playwright/test'
          docker run --rm --entrypoint sh "$IMG" -c '! test -e node_modules/vite'
          docker run --rm --entrypoint sh "$IMG" -c '! test -e node_modules/.bin/vite'
          # (a) no non-runtime trees.
          for tree in specs tests eval apps/explorer-web/src apps/explorer-web/e2e; do
            docker run --rm --entrypoint sh "$IMG" -c "! test -e $tree"
          done
          # Positive control: the runtime essentials ARE present.
          docker run --rm --entrypoint sh "$IMG" -c \
            'test -f apps/explorer-api/src/server.ts && test -d apps/explorer-web/dist && test -d migrations && test -f scripts/docker-entrypoint.sh && test -d vendor'
          echo "image size (bytes): $(docker image inspect "$IMG" --format '{{.Size}}')"

      - name: Build + push (linux/amd64 — matches the cx43/cx33 nodes)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: production rollout (terraform + kubectl apply -k) lives in the private danni-bg/deploy repo —
  # the commercial deployment layer. This open-core repo only builds + publishes the app image above.
